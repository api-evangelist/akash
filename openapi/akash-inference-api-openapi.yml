openapi: 3.2.0
info:
  title: AkashML Inference API
  description: AkashML public API for inference. Use your AkashML API key to access OpenAI-compatible chat completions, text completions, and model listings, plus the Anthropic-compatible Messages API.
  version: 1.0.0
servers:
- url: https://api.akashml.com
  description: Production
tags:
- name: Inference
  description: OpenAI-compatible chat and text completions
paths:
  /v1/chat/completions:
    post:
      summary: Create chat completion
      tags:
      - Inference
      description: 'Creates a model response for the given chat conversation. Supports streaming via SSE when `stream: true`.


        **Response headers**


        - `Inference-Id` — Unique ID for this request. Include this when contacting support.


        **Error codes**


        | Status | Meaning |

        |--------|---------|

        | `402` | Insufficient credits |

        | `429` | Rate limited |

        | `504` | No backend available |

        | `529` | No healthy backends are available for the requested model |'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: The model to use for inference, e.g. `meta-llama/Llama-3.3-70B-Instruct`.
                messages:
                  type: array
                  items:
                    type: object
                    description: A message in the conversation.
                    properties:
                      role:
                        type: string
                        description: 'The role of the message author. Common values: `system`, `user`, `assistant`, `tool`. Use `developer` for system-level instructions on newer OpenAI models.'
                      content:
                        description: The content of the message. Can be a string, an array of content parts (text, image_url, etc.), or null for assistant messages that only contain tool_calls.
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: object
                        - type:
                          - object
                          - 'null'
                          enum:
                          - null
                      name:
                        type: string
                        description: An optional name for the participant, to differentiate between participants with the same role.
                      tool_calls:
                        type: array
                        items:
                          type: object
                        description: Tool calls generated by the model, present on assistant messages.
                      tool_call_id:
                        type: string
                        description: The ID of the tool call this message is responding to. Required for `tool` role messages.
                    additionalProperties: true
                  description: A list of messages comprising the conversation so far.
                temperature:
                  type: number
                  description: Sampling temperature between 0 and 2. Higher values produce more random output; lower values are more deterministic. Defaults to 1.
                max_tokens:
                  type: integer
                  description: Maximum number of tokens to generate. Deprecated in favor of `max_completion_tokens`.
                max_completion_tokens:
                  type: integer
                  description: Upper bound on tokens generated, including reasoning tokens. Preferred over `max_tokens`.
                top_p:
                  type: number
                  description: 'Nucleus sampling: only tokens comprising the top `top_p` probability mass are considered. Defaults to 1.'
                frequency_penalty:
                  type: number
                  description: Number between -2.0 and 2.0. Penalizes tokens based on their frequency so far, reducing repetition.
                presence_penalty:
                  type: number
                  description: Number between -2.0 and 2.0. Penalizes tokens that have appeared at all so far, encouraging new topics.
                stop:
                  description: One or more sequences where generation stops. The stop string itself is not included in the output.
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                stream:
                  type: boolean
                  description: 'If true, the response is streamed back as Server-Sent Events (SSE). Each chunk is a `data:` line containing a partial JSON object. The stream ends with `data: [DONE]`.'
                stream_options:
                  description: Options for streaming responses. Only valid when `stream` is true.
                  type:
                  - object
                  - 'null'
                  properties:
                    include_usage:
                      type: boolean
                      description: If true, a final chunk is emitted with token usage statistics.
                tools:
                  type: array
                  items:
                    type: object
                  description: A list of tools the model may call. Each tool should follow the OpenAI function-calling schema.
                tool_choice:
                  description: 'Controls which tool the model calls. `none` disables tools, `auto` lets the model decide, `required` forces a tool call. Pass `{"type": "function", "function": {"name": "..."}}` to force a specific function.'
                  anyOf:
                  - type: string
                  - type: object
                parallel_tool_calls:
                  type: boolean
                  description: Whether to allow the model to make multiple tool calls in parallel. Defaults to true.
                response_format:
                  type: object
                  description: 'Output format. Use `{"type": "json_schema", "json_schema": {...}}` for Structured Outputs, `{"type": "json_object"}` for legacy JSON mode, or `{"type": "text"}` for plain text.'
                seed:
                  type: integer
                  description: If specified, the system will attempt deterministic sampling so repeated requests with the same seed and parameters return the same result.
                n:
                  type: integer
                  description: How many chat completion choices to generate per message. Defaults to 1.
                user:
                  type: string
                  description: A unique identifier representing the end-user. Useful for abuse monitoring.
                logprobs:
                  type: boolean
                  description: Whether to return log probabilities for each output token. Defaults to false.
                top_logprobs:
                  type: integer
                  description: 'Number of top token log probabilities to return per position (0–20). Requires `logprobs: true`.'
                logit_bias:
                  type: object
                  description: Map of token IDs to bias values (-100 to 100). Positive values increase, negative values decrease the likelihood of the token being selected.
                service_tier:
                  type: string
                  description: Latency tier for the request. Use `auto` or `default`.
                modalities:
                  type: array
                  items:
                    type: string
                  description: Output types to generate. Defaults to `["text"]`. Use `["text", "audio"]` for audio output.
                reasoning_effort:
                  type: string
                  description: 'Controls how much reasoning the model does before responding. Common values: `low`, `medium`, `high`. Supported by reasoning models (o-series, etc.). gpt-oss models support `low`, `medium` and `high` only — `minimal` maps to `low`, `xhigh` and `max` map to `high`, and `none` is rejected because these models always reason.'
                function_call:
                  description: Deprecated. Use `tool_choice` instead.
                  anyOf:
                  - type: string
                  - type: object
                functions:
                  type: array
                  items:
                    type: object
                  description: Deprecated. Use `tools` instead.
                reasoning:
                  type: object
                  description: Akash-specific reasoning control parameters.
                  properties:
                    effort:
                      type: string
                      description: 'Reasoning effort level. Common values: `xhigh`, `high`, `medium`, `low`, `minimal`, `none`. Accepted values vary by model and provider. Takes the same per-model constraints as `reasoning_effort`, which wins if both are sent.'
                    max_tokens:
                      type: integer
                      description: Maximum tokens to spend on reasoning.
                    exclude:
                      type: boolean
                      description: If true, reasoning tokens are excluded from the response.
                    enabled:
                      type: boolean
                      description: Whether to enable reasoning. Defaults to the model's default behavior.
                  additionalProperties: true
              required:
              - model
              - messages
              additionalProperties: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                            tool_calls:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                            tool_call_id:
                              type: string
                          additionalProperties: true
                        finish_reason:
                          type: string
                          description: 'Why generation stopped. One of: `stop`, `length`, `tool_calls`, `content_filter`.'
                      additionalProperties: true
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
                      prompt_tokens_details:
                        type: object
                        properties:
                          cached_tokens:
                            type: integer
                            description: Prompt tokens served from the prefix cache. Present only for models that bill a cached input rate.
                          audio_tokens:
                            type: integer
                      completion_tokens_details:
                        type: object
                        properties:
                          reasoning_tokens:
                            type: integer
                            description: Completion tokens spent on reasoning, for reasoning models.
                          audio_tokens:
                            type: integer
                          accepted_prediction_tokens:
                            type: integer
                          rejected_prediction_tokens:
                            type: integer
                additionalProperties: true
      operationId: postV1ChatCompletions
      x-operation-id-source: derived
  /v1/completions:
    post:
      summary: Create completion
      tags:
      - Inference
      description: 'Creates a completion for the provided prompt. Supports streaming via SSE when `stream: true`.


        **Response headers**


        - `Inference-Id` — Unique ID for this request. Include this when contacting support.


        **Error codes**


        | Status | Meaning |

        |--------|---------|

        | `402` | Insufficient credits |

        | `429` | Rate limited |

        | `504` | No backend available |

        | `529` | No healthy backends are available for the requested model |'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: The model to use for inference.
                prompt:
                  description: The prompt to complete. Can be a string, array of strings, or array of token IDs.
                  anyOf:
                  - type: string
                  - type: array
                temperature:
                  type: number
                  description: Sampling temperature. Higher values produce more random output.
                max_tokens:
                  type: integer
                  description: Maximum number of tokens to generate.
                top_p:
                  type: number
                  description: Nucleus sampling probability mass threshold.
                frequency_penalty:
                  type: number
                  description: Penalizes repeated tokens based on frequency.
                presence_penalty:
                  type: number
                  description: Penalizes tokens that have already appeared.
                stop:
                  description: Sequence(s) at which generation stops.
                  anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                stream:
                  type: boolean
                  description: Stream the response as SSE.
                n:
                  type: integer
                  description: Number of completions to generate. Defaults to 1.
                user:
                  type: string
                  description: End-user identifier for abuse monitoring.
              required:
              - model
              - prompt
              additionalProperties: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        text:
                          type: string
                        finish_reason:
                          type: string
                      additionalProperties: true
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
                      prompt_tokens_details:
                        type: object
                        properties:
                          cached_tokens:
                            type: integer
                            description: Prompt tokens served from the prefix cache. Present only for models that bill a cached input rate.
                          audio_tokens:
                            type: integer
                      completion_tokens_details:
                        type: object
                        properties:
                          reasoning_tokens:
                            type: integer
                            description: Completion tokens spent on reasoning, for reasoning models.
                          audio_tokens:
                            type: integer
                          accepted_prediction_tokens:
                            type: integer
                          rejected_prediction_tokens:
                            type: integer
                additionalProperties: true
      operationId: postV1Completions
      x-operation-id-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key passed as Bearer token
