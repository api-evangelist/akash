apis:
- name: Akash Console Deployment API
  description: REST API for programmatic deployment management on Akash Network with managed wallets and credit-card
    billing. Supports creating, listing, updating, and closing deployments via SDL manifests. Includes bid management,
    lease creation, and escrow funding operations. Designed for SaaS platforms and non-crypto-native users.
  image: https://akash.network/favicon.ico
  humanURL: https://akash.network/docs/api-documentation/console-api/
  baseURL: https://console-api.akash.network
  tags:
  - Deployment
  - Leases
  - Bids
  - Escrow
  - Cloud
  tags_raw:
  - Deployments
  - Leases
  - Bids
  - Escrow
  - Cloud
  properties:
  - type: Documentation
    url: https://akash.network/docs/api-documentation/console-api/
  - type: GettingStarted
    url: https://akash.network/docs/api-documentation/console-api/getting-started
  - type: ReferenceDocumentation
    url: https://akash.network/docs/api-documentation/console-api/api-reference
  contact:
  - FN: Akash Network Support
    url: https://akash.network/community
  X-pricing:
  - plans:
    - name: Pay-As-You-Go
      description: Credit-card billing for managed wallet deployments. Minimum deposit $0.50. Billed in USD; API
        converts to AKT/USDC on-chain automatically.
      url: https://console.akash.network/
      price: 0.0
  X-rateLimit:
  - rate:
    - requests: 1
      unit: second
      notes: Avoid polling faster than every 3 seconds. 429 TooManyRequests returned when rate exceeded. Implement
        exponential backoff on 5xx errors.
  X-authentication:
  - type: x-api-key
    description: Pass API key via x-api-key header. Create and manage keys at console.akash.network under Settings
      > API Keys.
    url: https://console.akash.network/settings/api-keys
- name: Akash Console Network Data API
  description: Publicly accessible indexed API for querying provider information, GPU availability, resource statistics,
    and network-wide metrics. No authentication required. Returns real-time provider resource availability, hardware
    specifications, uptime, and GPU models across the Akash Network marketplace.
  image: https://akash.network/favicon.ico
  humanURL: https://akash.network/docs/api-documentation/rest-api/providers-api/
  baseURL: https://console-api.akash.network
  tags:
  - Providers
  - GPU
  - Network Stats
  - Public
  - Monitoring
  properties:
